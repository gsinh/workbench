# Fail any push or pull request that contains a secret, across the full
# history. Runs the official gitleaks release binary, pinned and checked
# against its published SHA-256, with .gitleaks.toml (default rules plus one
# documented exception for the STIR/SHAKEN test fixtures).
name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" gitleaks
      - name: Scan the full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
